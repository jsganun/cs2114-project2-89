<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Helvetica, Arial, sans-serif">
  <title>LibCatS system diagram</title>
  <desc>Main starts ConsoleMenu, which calls Catalogue. Catalogue stores data in three LinkedChain objects holding LibraryItem, CheckoutRecord and WaitlistEntry. ConsoleMenu keeps a fourth LinkedChain of String.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="40" y="38" font-size="22" font-weight="700" fill="#111">LibCatS: how the pieces fit</text>
  <text x="40" y="60" font-size="13" fill="#555">Arrows point from the caller to the class it calls. Teal boxes are the one generic class, LinkedChain&lt;T&gt;, reused four times.</text>

  <!-- Main -->
  <rect x="40" y="84" width="300" height="52" rx="6" fill="#f4f4f2" stroke="#444" stroke-width="1.5"/>
  <text x="56" y="107" font-size="15" font-weight="700" fill="#111">Main</text>
  <text x="56" y="126" font-size="12" fill="#444">builds the sample catalogue, starts the menu</text>

  <!-- ConsoleMenu -->
  <rect x="40" y="176" width="300" height="64" rx="6" fill="#f4f4f2" stroke="#444" stroke-width="1.5"/>
  <text x="56" y="199" font-size="15" font-weight="700" fill="#111">ConsoleMenu</text>
  <text x="56" y="218" font-size="12" fill="#444">only class that reads or prints; first layer</text>
  <text x="56" y="233" font-size="12" fill="#444">of input checks (re-prompts on bad input)</text>

  <!-- history chain -->
  <rect x="560" y="184" width="360" height="48" rx="6" fill="#d9efec" stroke="#0b6b61" stroke-width="2"/>
  <text x="576" y="206" font-size="14" font-weight="700" fill="#0b4a43">LinkedChain&lt;String&gt;</text>
  <text x="576" y="224" font-size="12" fill="#0b4a43">recent activity, newest first (add)</text>

  <!-- Catalogue -->
  <rect x="40" y="288" width="300" height="76" rx="6" fill="#f4f4f2" stroke="#444" stroke-width="1.5"/>
  <text x="56" y="311" font-size="15" font-weight="700" fill="#111">Catalogue</text>
  <text x="56" y="330" font-size="12" fill="#444">the rules: assigns serials, checkout and return,</text>
  <text x="56" y="345" font-size="12" fill="#444">waitlist, search; throws on a broken rule</text>

  <!-- three chains -->
  <rect x="40" y="428" width="280" height="60" rx="6" fill="#d9efec" stroke="#0b6b61" stroke-width="2"/>
  <text x="56" y="451" font-size="14" font-weight="700" fill="#0b4a43">LinkedChain&lt;LibraryItem&gt;</text>
  <text x="56" y="470" font-size="12" fill="#0b4a43">field items: every item, in order added</text>

  <rect x="340" y="428" width="280" height="60" rx="6" fill="#d9efec" stroke="#0b6b61" stroke-width="2"/>
  <text x="356" y="451" font-size="14" font-weight="700" fill="#0b4a43">LinkedChain&lt;CheckoutRecord&gt;</text>
  <text x="356" y="470" font-size="12" fill="#0b4a43">field records: one per loan</text>

  <rect x="640" y="428" width="280" height="60" rx="6" fill="#d9efec" stroke="#0b6b61" stroke-width="2"/>
  <text x="656" y="451" font-size="14" font-weight="700" fill="#0b4a43">LinkedChain&lt;WaitlistEntry&gt;</text>
  <text x="656" y="470" font-size="12" fill="#0b4a43">field waitlist: people waiting, in order</text>

  <!-- element types -->
  <rect x="40" y="540" width="280" height="40" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="56" y="565" font-size="14" font-weight="700" fill="#111">LibraryItem <tspan font-weight="400" font-size="12" fill="#444">(abstract)</tspan></text>
  <rect x="40" y="598" width="50" height="34" rx="4" fill="#f4f4f2" stroke="#777"/><text x="65" y="620" font-size="11" text-anchor="middle" fill="#111">Book</text>
  <rect x="96" y="598" width="64" height="34" rx="4" fill="#f4f4f2" stroke="#777"/><text x="128" y="620" font-size="11" text-anchor="middle" fill="#111">Magazine</text>
  <rect x="166" y="598" width="46" height="34" rx="4" fill="#f4f4f2" stroke="#777"/><text x="189" y="620" font-size="11" text-anchor="middle" fill="#111">DVD</text>
  <rect x="218" y="598" width="52" height="34" rx="4" fill="#f4f4f2" stroke="#777"/><text x="244" y="620" font-size="11" text-anchor="middle" fill="#111">Device</text>
  <rect x="276" y="598" width="44" height="34" rx="4" fill="#f4f4f2" stroke="#777"/><text x="298" y="620" font-size="11" text-anchor="middle" fill="#111">Game</text>
  <line x1="180" y1="580" x2="180" y2="598" stroke="#777"/>
  <text x="40" y="654" font-size="11" fill="#555">five subclasses, all stored together in the one chain</text>

  <rect x="340" y="540" width="280" height="40" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="356" y="565" font-size="14" font-weight="700" fill="#111">CheckoutRecord <tspan font-weight="400" font-size="12" fill="#444">(serial, borrower)</tspan></text>

  <rect x="640" y="540" width="280" height="40" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="656" y="565" font-size="14" font-weight="700" fill="#111">WaitlistEntry <tspan font-weight="400" font-size="12" fill="#444">(serial, borrower)</tspan></text>

  <!-- arrows -->
  <line x1="190" y1="136" x2="190" y2="174" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="190" y1="240" x2="190" y2="286" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="340" y1="208" x2="558" y2="208" stroke="#0b6b61" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M190 364 L190 396 L180 396 L180 426" fill="none" stroke="#0b6b61" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M190 364 L190 396 L480 396 L480 426" fill="none" stroke="#0b6b61" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M190 364 L190 396 L780 396 L780 426" fill="none" stroke="#0b6b61" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="180" y1="488" x2="180" y2="538" stroke="#444" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="480" y1="488" x2="480" y2="538" stroke="#444" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="780" y1="488" x2="780" y2="538" stroke="#444" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="196" y="520" font-size="11" fill="#555">holds</text>
  <text x="496" y="520" font-size="11" fill="#555">holds</text>
  <text x="796" y="520" font-size="11" fill="#555">holds</text>
  <text x="206" y="392" font-size="11" fill="#0b4a43">public API only: add, addToEnd, remove(T), contains, size, toArray</text>

  <!-- legend / note -->
  <text x="360" y="640" font-size="12" fill="#333">LinkedChain.java is one generic class. It stores nodes and counts them</text>
  <text x="360" y="658" font-size="12" fill="#333">and holds no library logic. Element types: LibraryItem, CheckoutRecord,</text>
  <text x="360" y="676" font-size="12" fill="#333">WaitlistEntry, String.</text>
</svg>
